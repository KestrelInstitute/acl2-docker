# Build ACL2 allcerts Docker Image (linux/amd64, self-hosted)
#
# This workflow builds the 'allcerts' target of the Dockerfile on a
# self-hosted Ubuntu runner:
#   - SBCL + ACL2 (same as the lean multi-platform image)
#   - STP (for Axe) and Z3 (for Smtlink)
#   - all books of the standard "make regression" suite certified
#   - certification artifacts not needed by include-book removed
#
# The image is pushed to ghcr.io/kestrelinstitute/acl2-allcerts.
#
# Because the 'allcerts' Dockerfile stage builds on the 'kcerts' stage, this
# workflow ALSO pushes the intermediate linux/amd64 kcerts image, as
# ghcr.io/kestrelinstitute/acl2-kcerts:<tag>-amd64 (the arch-suffixed tag
# that the kcerts workflow's manifest is assembled from).  It is pushed
# BEFORE the full regression runs, so even a regression failure in a
# non-kestrel book leaves a usable kcerts amd64 image behind.  Note that
# multi-platform kcerts manifest tags (master-abc1234, latest) are only
# created by docker-kcerts-selfhosted.yml, which also needs the macOS ARM64
# runner; run it after this workflow for the same commit and its amd64 half
# comes straight from this runner's Docker cache.
#
# Runner requirements (see RUNNER-SETUP-UBUNTU-AMD64.md):
#   - x86-64 machine running Ubuntu 22.04 (or later) with Docker Engine
#   - lots of RAM (32+ GB recommended) and disk (200+ GB free recommended)
#   - registered with the default labels: self-hosted, Linux, X64
#
# The build is STRICT: if any book fails to certify, the build fails and no
# image is pushed.  The regression runs with make -k, so all failures are
# reported in one run; failed books are listed at the end of the build log.
#
# Note: images built on self-hosted runners do not get SLSA attestation.

name: Build ACL2 allcerts Docker (amd64, self-hosted)

on:
  workflow_dispatch:
    inputs:
      acl2_ref:
        description: 'ACL2 ref/commit to build (usually left blank, meaning latest master)'
        required: false
        default: ''
      additional_tag:
        description: 'Extra tag (usually left blank)'
        required: false
        default: ''
      cert_jobs:
        description: 'Parallel certification jobs (blank = all cores on the runner)'
        required: false
        default: ''
      push_to_registry:
        description: 'Push to registry?'
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kestrelinstitute/acl2-allcerts
  KCERTS_IMAGE_NAME: kestrelinstitute/acl2-kcerts

permissions:
  contents: read
  packages: write

jobs:
  # ==========================================================================
  # Job 1: Resolve ACL2 commit hash
  # ==========================================================================
  resolve-commit:
    runs-on: ubuntu-latest
    outputs:
      acl2_commit: ${{ steps.resolve.outputs.commit }}
      acl2_commit_short: ${{ steps.resolve.outputs.commit_short }}
      build_type: ${{ steps.resolve.outputs.build_type }}
      image_tag: ${{ steps.resolve.outputs.image_tag }}
    steps:
      - name: Resolve ACL2 commit hash
        id: resolve
        run: |
          REF="${{ inputs.acl2_ref }}"
          if [ -z "$REF" ] || [ "$REF" = "master" ]; then
            REF="master"
            BUILD_TYPE="master"
          else
            BUILD_TYPE="commit"
          fi
          echo "Resolving ref: ${REF} (build_type: ${BUILD_TYPE})"

          RESPONSE=$(curl -sL "https://api.github.com/repos/acl2/acl2/commits/${REF}")
          COMMIT=$(echo "$RESPONSE" | jq -r '.sha')

          if [ "$COMMIT" = "null" ] || [ -z "$COMMIT" ]; then
            echo "Failed to resolve ref: ${REF}"
            echo "API response: $RESPONSE"
            exit 1
          fi

          COMMIT_SHORT="${COMMIT:0:7}"
          IMAGE_TAG="${BUILD_TYPE}-${COMMIT_SHORT}"

          echo "commit=${COMMIT}" >> $GITHUB_OUTPUT
          echo "commit_short=${COMMIT_SHORT}" >> $GITHUB_OUTPUT
          echo "build_type=${BUILD_TYPE}" >> $GITHUB_OUTPUT
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "Resolved ${REF} to ${COMMIT} (tag: ${IMAGE_TAG})"

  # ==========================================================================
  # Job 2: Build (and optionally push) the allcerts image
  # ==========================================================================
  build-allcerts:
    needs: resolve-commit
    # Default labels of a self-hosted Ubuntu x86-64 runner.
    # (The macOS ARM64 runner for the multi-platform workflow has different
    # labels, so there is no risk of the wrong runner picking this up.)
    runs-on: [self-hosted, Linux, X64]
    # A full regression takes on the order of an hour on a large server, but
    # allow much longer for smaller machines and cold Docker caches.
    timeout-minutes: 2880
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      # Use the 'docker' driver: layers are cached in the runner's Docker
      # daemon across builds (the SBCL and STP stages rarely change), and the
      # multi-GB allcerts layers are not exported to a separate cache.
      # Run "docker system prune" on the runner occasionally (see
      # RUNNER-SETUP-UBUNTU-AMD64.md).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.resolve-commit.outputs.image_tag }}"

          # Add additional tag if specified
          if [ -n "${{ inputs.additional_tag }}" ]; then
            TAGS="$TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.additional_tag }}"
          # Auto-add "latest" for default master builds (empty ref and empty additional_tag)
          elif [ -z "${{ inputs.acl2_ref }}" ]; then
            TAGS="$TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            echo "Auto-adding 'latest' tag for default master build"
          fi

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "Tags: ${TAGS}"

      # Build and push the intermediate kcerts image first.  The allcerts
      # stage is built FROM the kcerts stage, so this costs nothing extra:
      # the allcerts build below reuses these layers from the Docker cache.
      # Doing it first means a kcerts amd64 image is pushed even if the full
      # regression later fails on a non-kestrel book.
      - name: Build and push kcerts amd64 image (arch-suffixed tag)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: kcerts
          platforms: linux/amd64
          push: ${{ inputs.push_to_registry }}
          tags: ${{ env.REGISTRY }}/${{ env.KCERTS_IMAGE_NAME }}:${{ needs.resolve-commit.outputs.image_tag }}-amd64
          build-args: |
            ACL2_COMMIT=${{ needs.resolve-commit.outputs.acl2_commit }}
            ACL2_BUILD_TYPE=${{ needs.resolve-commit.outputs.build_type }}
            CERT_JOBS=${{ inputs.cert_jobs }}
          labels: |
            org.opencontainers.image.revision=${{ needs.resolve-commit.outputs.acl2_commit }}
            org.opencontainers.image.source=https://github.com/acl2/acl2
            org.opencontainers.image.description=ACL2 ${{ needs.resolve-commit.outputs.image_tag }} on SBCL, kestrel/top books certified, with STP and Z3

      - name: Build and push allcerts image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: allcerts
          platforms: linux/amd64
          push: ${{ inputs.push_to_registry }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            ACL2_COMMIT=${{ needs.resolve-commit.outputs.acl2_commit }}
            ACL2_BUILD_TYPE=${{ needs.resolve-commit.outputs.build_type }}
            CERT_JOBS=${{ inputs.cert_jobs }}
          labels: |
            org.opencontainers.image.revision=${{ needs.resolve-commit.outputs.acl2_commit }}
            org.opencontainers.image.source=https://github.com/acl2/acl2
            org.opencontainers.image.description=ACL2 ${{ needs.resolve-commit.outputs.image_tag }} on SBCL, all regression books certified, with STP and Z3

      - name: Report certification failure
        if: failure()
        run: |
          echo "## allcerts Build FAILED" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The build is strict: no allcerts image was pushed.  (If the" >> $GITHUB_STEP_SUMMARY
          echo "'kcerts amd64' step succeeded before the failure, that image" >> $GITHUB_STEP_SUMMARY
          echo "WAS pushed and is usable.)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "If the failure was during book certification, the end of the" >> $GITHUB_STEP_SUMMARY
          echo "'Build and push allcerts image' step log lists the books that" >> $GITHUB_STEP_SUMMARY
          echo "failed (under 'REGRESSION FAILED').  Details for each failed book" >> $GITHUB_STEP_SUMMARY
          echo "appear earlier in the log; search for 'CERTIFICATION FAILED'." >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # Job 3: Summary
  # ==========================================================================
  summary:
    needs: [resolve-commit, build-allcerts]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Print summary
        run: |
          echo "## Build Summary (allcerts, linux/amd64)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| ACL2 Commit | \`${{ needs.resolve-commit.outputs.acl2_commit }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Type | \`${{ needs.resolve-commit.outputs.build_type }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag | \`${{ needs.resolve-commit.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ inputs.additional_tag }}" ]; then
            echo "| Additional Tag | \`${{ inputs.additional_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          elif [ -z "${{ inputs.acl2_ref }}" ]; then
            echo "| Additional Tag | \`latest\` (auto) |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -n "${{ inputs.cert_jobs }}" ]; then
            echo "| Cert Jobs | \`-j${{ inputs.cert_jobs }}\` |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Cert Jobs | all runner cores |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| Push to Registry | ${{ inputs.push_to_registry }} |" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.build-allcerts.result }}" != "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Build did not succeed; see the build-allcerts job for details.**" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          if [ "${{ inputs.push_to_registry }}" = "true" ]; then
            echo "| Digest | \`${{ needs.build-allcerts.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            echo "## Pull Commands" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.resolve-commit.outputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "This image is linux/amd64 only and contains all regression books" >> $GITHUB_STEP_SUMMARY
            echo "with their certifications, plus the STP and Z3 solvers.  See INSTALL.md." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Also pushed along the way:" >> $GITHUB_STEP_SUMMARY
            echo "\`${{ env.REGISTRY }}/${{ env.KCERTS_IMAGE_NAME }}:${{ needs.resolve-commit.outputs.image_tag }}-amd64\`" >> $GITHUB_STEP_SUMMARY
            echo "(the linux/amd64 half of the kcerts image; run the kcerts workflow" >> $GITHUB_STEP_SUMMARY
            echo "to add the arm64 half and the multi-platform kcerts tags)." >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** built on a self-hosted runner; no SLSA attestation." >> $GITHUB_STEP_SUMMARY
