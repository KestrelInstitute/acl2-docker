# ============================================================================
# EXAMPLE ONLY -- NOT AN ACTIVE WORKFLOW
#
# GitHub only runs workflows from .github/workflows/, so this file, kept
# under examples/workflows/, cannot be dispatched from this repository.
# It is a snapshot of a workflow we run from a private CI repository
# against our own self-hosted runners, preserved here as an example of
# how someone else could set up the same build.
#
# To adapt it for your own repository:
#   - copy it into .github/workflows/
#   - set up self-hosted runner(s) with matching labels; see the
#     RUNNER-SETUP-*.md guides in examples/
#   - change the registry organization in the image names
#     (ghcr.io/kestrelinstitute/...) to your own
# ============================================================================

# Build ACL2 kcerts Docker Image (Multi-Platform, self-hosted)
#
# This workflow builds the 'kcerts' target of the Dockerfile:
#   - SBCL + ACL2 (same as the lean multi-platform image)
#   - STP (for Axe) and Z3 (for Smtlink)
#   - all books reachable from kestrel/top certified (via cert.pl)
#   - certification artifacts not needed by include-book removed
#
# Both platforms are built on self-hosted runners (a book certification of
# this size does not fit GitHub-hosted runners):
#   - linux/amd64 on the self-hosted Ubuntu x86-64 runner
#     (see RUNNER-SETUP-UBUNTU-AMD64.md; labels: self-hosted, Linux, X64)
#   - linux/arm64 on the self-hosted Apple Silicon Mac runner
#     (see RUNNER-SETUP-MACOS-ARM64.md; labels: self-hosted, macOS, ARM64)
#     Give Docker Desktop plenty of memory (32 GB recommended) before
#     dispatching, or set a modest cert_jobs value.
#
# Each platform is pushed under an architecture-suffixed tag (e.g.
# master-abc1234-amd64), then combined into a multi-platform manifest under
# the usual tags (master-abc1234, latest).  The image is pushed to
# ghcr.io/kestrelinstitute/acl2-kcerts.
#
# Tip: the allcerts workflow also pushes the amd64 arch-suffixed kcerts tag
# (its 'allcerts' stage builds on the 'kcerts' stage).  If allcerts has
# already run for the same commit, this workflow's amd64 job comes straight
# from that runner's Docker cache and finishes quickly; the real work here
# is the arm64 build on the Mac.
#
# The build is STRICT: if any book fails to certify, that platform's build
# fails and no manifest is pushed.  Certification runs with --keep-going, so
# all failures are reported in one run; failed books are listed at the end
# of the build log.
#
# Note: images built on self-hosted runners do not get SLSA attestation.

name: Build ACL2 kcerts Docker (Multi-Platform, self-hosted)

on:
  workflow_dispatch:
    inputs:
      acl2_ref:
        description: 'ACL2 ref/commit to build (usually left blank, meaning latest master)'
        required: false
        default: ''
      additional_tag:
        description: 'Extra tag (usually left blank)'
        required: false
        default: ''
      cert_jobs:
        description: 'Parallel certification jobs (blank = all cores on each runner)'
        required: false
        default: ''
      push_to_registry:
        description: 'Push to registry?'
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kestrelinstitute/acl2-kcerts

permissions:
  contents: read
  packages: write

jobs:
  # ==========================================================================
  # Job 1: Resolve ACL2 commit hash
  # ==========================================================================
  resolve-commit:
    runs-on: ubuntu-latest
    outputs:
      acl2_commit: ${{ steps.resolve.outputs.commit }}
      acl2_commit_short: ${{ steps.resolve.outputs.commit_short }}
      build_type: ${{ steps.resolve.outputs.build_type }}
      image_tag: ${{ steps.resolve.outputs.image_tag }}
    steps:
      - name: Resolve ACL2 commit hash
        id: resolve
        run: |
          REF="${{ inputs.acl2_ref }}"
          if [ -z "$REF" ] || [ "$REF" = "master" ]; then
            REF="master"
            BUILD_TYPE="master"
          else
            BUILD_TYPE="commit"
          fi
          echo "Resolving ref: ${REF} (build_type: ${BUILD_TYPE})"

          RESPONSE=$(curl -sL "https://api.github.com/repos/acl2/acl2/commits/${REF}")
          COMMIT=$(echo "$RESPONSE" | jq -r '.sha')

          if [ "$COMMIT" = "null" ] || [ -z "$COMMIT" ]; then
            echo "Failed to resolve ref: ${REF}"
            echo "API response: $RESPONSE"
            exit 1
          fi

          COMMIT_SHORT="${COMMIT:0:7}"
          IMAGE_TAG="${BUILD_TYPE}-${COMMIT_SHORT}"

          echo "commit=${COMMIT}" >> $GITHUB_OUTPUT
          echo "commit_short=${COMMIT_SHORT}" >> $GITHUB_OUTPUT
          echo "build_type=${BUILD_TYPE}" >> $GITHUB_OUTPUT
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "Resolved ${REF} to ${COMMIT} (tag: ${IMAGE_TAG})"

  # ==========================================================================
  # Job 2: Build amd64 image (self-hosted Ubuntu x86-64 runner)
  # ==========================================================================
  build-kcerts-amd64:
    needs: resolve-commit
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 2880
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v7

      # Use the 'docker' driver: layers are cached in the runner's Docker
      # daemon across builds (the SBCL and STP stages rarely change), and the
      # multi-GB certified layers are not exported to a separate cache.
      # Run "docker system prune" on the runner occasionally.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64 image (arch-suffixed tag)
        id: build
        uses: docker/build-push-action@v7
        with:
          # keep pushes as plain manifests (v6+ defaults provenance on for pushes)
          provenance: false
          context: .
          file: ./Dockerfile
          target: kcerts
          platforms: linux/amd64
          push: ${{ inputs.push_to_registry }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.resolve-commit.outputs.image_tag }}-amd64
          build-args: |
            ACL2_COMMIT=${{ needs.resolve-commit.outputs.acl2_commit }}
            ACL2_BUILD_TYPE=${{ needs.resolve-commit.outputs.build_type }}
            CERT_JOBS=${{ inputs.cert_jobs }}
          labels: |
            org.opencontainers.image.revision=${{ needs.resolve-commit.outputs.acl2_commit }}
            org.opencontainers.image.source=https://github.com/acl2/acl2
            org.opencontainers.image.description=ACL2 ${{ needs.resolve-commit.outputs.image_tag }} on SBCL, kestrel/top books certified, with STP and Z3

      - name: Report certification failure
        if: failure()
        run: |
          echo "## kcerts amd64 Build FAILED" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The build is strict: no manifest will be pushed." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "If the failure was during book certification, the end of the" >> $GITHUB_STEP_SUMMARY
          echo "build step log lists the books that failed (under" >> $GITHUB_STEP_SUMMARY
          echo "'CERTIFICATION FAILED'); details for each appear earlier in" >> $GITHUB_STEP_SUMMARY
          echo "the log." >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # Job 3: Build arm64 image (self-hosted Apple Silicon runner)
  # ==========================================================================
  build-kcerts-arm64:
    needs: resolve-commit
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 2880
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v7

      # 'docker' driver: cache lives in Docker Desktop's daemon (no multi-GB
      # cache exports).  Note this differs from the lean multi-platform
      # workflow's arm64 job, which uses the default container driver with a
      # local cache directory; the two do not share caches.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arm64 image (arch-suffixed tag)
        id: build
        uses: docker/build-push-action@v7
        with:
          # keep pushes as plain manifests (v6+ defaults provenance on for pushes)
          provenance: false
          context: .
          file: ./Dockerfile
          target: kcerts
          platforms: linux/arm64
          push: ${{ inputs.push_to_registry }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.resolve-commit.outputs.image_tag }}-arm64
          build-args: |
            ACL2_COMMIT=${{ needs.resolve-commit.outputs.acl2_commit }}
            ACL2_BUILD_TYPE=${{ needs.resolve-commit.outputs.build_type }}
            CERT_JOBS=${{ inputs.cert_jobs }}
          labels: |
            org.opencontainers.image.revision=${{ needs.resolve-commit.outputs.acl2_commit }}
            org.opencontainers.image.source=https://github.com/acl2/acl2
            org.opencontainers.image.description=ACL2 ${{ needs.resolve-commit.outputs.image_tag }} on SBCL, kestrel/top books certified, with STP and Z3

      - name: Report certification failure
        if: failure()
        run: |
          echo "## kcerts arm64 Build FAILED" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The build is strict: no manifest will be pushed." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "If the failure was during book certification, the end of the" >> $GITHUB_STEP_SUMMARY
          echo "build step log lists the books that failed (under" >> $GITHUB_STEP_SUMMARY
          echo "'CERTIFICATION FAILED'); details for each appear earlier in" >> $GITHUB_STEP_SUMMARY
          echo "the log." >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # Job 4: Create multi-platform manifest
  # ==========================================================================
  create-manifest:
    needs: [resolve-commit, build-kcerts-amd64, build-kcerts-arm64]
    runs-on: ubuntu-latest
    if: ${{ inputs.push_to_registry }}
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-platform manifest
        id: manifest
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          BASE_TAG="${{ needs.resolve-commit.outputs.image_tag }}"

          # Construct tags (e.g., master-abc1234 or commit-abc1234)
          TAGS="-t ${IMAGE}:${BASE_TAG}"

          # Add additional tag if specified
          if [ -n "${{ inputs.additional_tag }}" ]; then
            TAGS="$TAGS -t ${IMAGE}:${{ inputs.additional_tag }}"
          # Auto-add "latest" for default master builds (empty ref and empty additional_tag)
          elif [ -z "${{ inputs.acl2_ref }}" ]; then
            TAGS="$TAGS -t ${IMAGE}:latest"
            echo "Auto-adding 'latest' tag for default master build"
          fi

          # Create manifest from the two arch-suffixed platform images.
          # (The -amd64/-arm64 tags remain in the registry; they are just
          # the per-platform carriers for this manifest.)
          docker buildx imagetools create $TAGS \
            "${IMAGE}:${BASE_TAG}-amd64" \
            "${IMAGE}:${BASE_TAG}-arm64"

          # Get the manifest digest
          MANIFEST_DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${BASE_TAG}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=${MANIFEST_DIGEST}" >> $GITHUB_OUTPUT
          echo "Created manifest with digest: ${MANIFEST_DIGEST}"

  # ==========================================================================
  # Job 5: Summary
  # ==========================================================================
  summary:
    needs: [resolve-commit, build-kcerts-amd64, build-kcerts-arm64, create-manifest]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Print summary
        run: |
          echo "## Build Summary (kcerts, Multi-Platform)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| ACL2 Commit | \`${{ needs.resolve-commit.outputs.acl2_commit }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Type | \`${{ needs.resolve-commit.outputs.build_type }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag | \`${{ needs.resolve-commit.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ inputs.additional_tag }}" ]; then
            echo "| Additional Tag | \`${{ inputs.additional_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          elif [ -z "${{ inputs.acl2_ref }}" ]; then
            echo "| Additional Tag | \`latest\` (auto) |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -n "${{ inputs.cert_jobs }}" ]; then
            echo "| Cert Jobs | \`-j${{ inputs.cert_jobs }}\` |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Cert Jobs | all cores of each runner |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| Push to Registry | ${{ inputs.push_to_registry }} |" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.build-kcerts-amd64.result }}" != "success" ] || \
             [ "${{ needs.build-kcerts-arm64.result }}" != "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**A build job did not succeed; see the build-kcerts-* jobs for details.**" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          if [ "${{ inputs.push_to_registry }}" = "true" ]; then
            echo "| Manifest Digest | \`${{ needs.create-manifest.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            echo "## Pull Commands" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "# Pull multi-platform image (auto-selects architecture)" >> $GITHUB_STEP_SUMMARY
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.resolve-commit.outputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "This image contains the books reachable from kestrel/top" >> $GITHUB_STEP_SUMMARY
            echo "with their certifications, plus the STP and Z3 solvers.  See INSTALL.md." >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** built on self-hosted runners; no SLSA attestation." >> $GITHUB_STEP_SUMMARY
